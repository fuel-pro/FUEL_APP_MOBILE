# FuelPro Backend - Fly.io Configuration

app = "fuelpro"
primary_region = "ord"

[build]
  dockerfile = "backend/Dockerfile"

[env]
  PORT = "8080"
  NODE_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[health_check]
  interval = 30
  timeout = 10
  restart_threshold = 3
