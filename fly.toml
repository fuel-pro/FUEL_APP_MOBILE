# FuelPro Backend - Fly.io Configuration
# Free forever with $5/month credits

app = "fuel-pro-backend"
primary_region = "ord"

[build]
  dockerfile = "backend/Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

# Health check
[health_check]
  interval = 30
  timeout = 10
  restart_threshold = 3

# Persistent volume for SQLite database
[[mounts]]
  source = "fuel_app_data"
  destination = "/app/data"

# Environment variables
[env]
  NODE_ENV = "production"

# Secrets (set via flyctl secrets set)
# FLY_API_TOKEN - for CI/CD deployments
