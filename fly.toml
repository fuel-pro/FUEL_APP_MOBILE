# FuelPro Backend - Fly.io Configuration
# Free tier: 3 shared VMs, 160GB bandwidth/month

app = "fuel-pro-backend"
primary_region = "iad"

[build]
  dockerfile = "backend/Dockerfile"

[env]
  PORT = "8080"
  NODE_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

# Persistent storage for SQLite
[[mounts]]
  source = "fuel_data"
  destination = "/app/data"
