name: Deploy to Fly.io (Free)

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'fly.toml'
      - '.github/workflows/deploy-fly.yml'
  workflow_dispatch:

jobs:
  deploy-fly:
    name: Deploy to Fly.io (Free)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Fly CLI
        run: |
          curl -L https://fly.io/install.sh | sh
          
          # Verify installation
          /root/.fly/bin/fly version

      - name: Deploy to Fly.io
        run: |
          set -euo pipefail
          
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "FLY_API_TOKEN not configured - skipping Fly.io deployment"
            echo ""
            echo "To enable deployment:"
            echo "1. Sign up at https://fly.io (free, no credit card)"
            echo "2. Run: fly auth login"
            echo "3. Run: fly tokens create"
            echo "4. Add the token as FLY_API_TOKEN in GitHub secrets"
            exit 0
          fi
          
          echo "Logging in to Fly.io..."
          /root/.fly/bin/fly auth login -t "$FLY_API_TOKEN"
          
          # Check if app exists, create if not
          if ! /root/.fly/bin/fly apps list | grep -q "fuel-pro-backend"; then
            echo "Creating new Fly.io app..."
            /root/.fly/bin/fly apps create fuel-pro-backend --org personal
          fi
          
          echo "Deploying fuel-pro-backend..."
          /root/.fly/bin/fly deploy --config fly.toml -a fuel-pro-backend
          
          echo "Deployed to Fly.io successfully!"
          echo "Your app is live at: https://fuel-pro-backend.fly.dev"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          CLERK_FRONTEND_API: ${{ secrets.CLERK_FRONTEND_API }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}