name: Deploy Backend to Render (Docker)

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'render.yaml'
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/fuel-pro/fuel_app_mobile/fuel-backend

jobs:
  build-and-deploy:
    name: Build Docker Image & Deploy to Render
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/fuel-pro/fuel_app_mobile/fuel-backend
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make image public
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Get the package ID first, then make it public
          PACKAGE_ID=$(gh api -H "Accept: application/vnd.github+json" \
            "/user/packages/container/fuel-backend/versions" 2>/dev/null | jq -r '.[0].id' || echo "")
          if [ -n "$PACKAGE_ID" ]; then
            gh api --method PATCH \
              -H "Accept: application/vnd.github+json" \
              "/user/packages/container/fuel-backend/versions/$PACKAGE_ID" \
              -f visibility=public || echo "Visibility update skipped"
          fi
          # Also try the org-level package API
          gh api \
            --method PUT \
            -H "Accept: application/vnd.github+json" \
            "orgs/fuel-pro/packages/container/fuel-backend/versions" || echo "Org-level update skipped"

      - name: Show deployment info
        run: |
          echo "✅ Docker image built and pushed to GHCR!"
          echo "   Image: ${{ env.IMAGE_NAME }}:latest"
          echo "   SHA: ${{ github.sha }}"
          echo ""
          echo "The Render Blueprint will now deploy using this pre-built image."
          echo "Check https://fuel-pro-backend.onrender.com/ in a few minutes."
