name: Deploy to Northflank (Free)

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-northflank.yml'
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/fuel-pro/fuel-pro-backend
  SERVICE_NAME: fuel-pro-backend
  PROJECT_NAME: fuel-pro

jobs:
  deploy:
    name: Build & Deploy to Northflank
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push to GHCR
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Northflank
        run: |
          if [ -z "$NORTHFLANK_TOKEN" ]; then
            echo "Northflank token not configured"
            exit 1
          fi
          
          echo "Creating project on Northflank..."
          
          # Create project
          echo "Creating project: $PROJECT_NAME"
          CREATE_RESULT=$(curl -s -X POST "https://api.northflank.com/v1/projects" \
            -H "Authorization: Bearer $NORTHFLANK_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"name\":\"$PROJECT_NAME\"}")
          echo "Create result: $CREATE_RESULT"
          
          sleep 5
          
          # Get projects to find the ID (parse JSON properly)
          echo "Getting project list..."
          PROJECTS=$(curl -s "https://api.northflank.com/v1/projects" \
            -H "Authorization: Bearer $NORTHFLANK_TOKEN")
          echo "Projects response: $PROJECTS"
          
          # Parse using jq or grep
          PROJECT_ID=$(echo "$PROJECTS" | python3 -c "import sys,json; d=json.load(sys.stdin); projs=d.get('data',{}).get('projects',[]); [print(p['id']) for p in projs if p.get('name')=='$PROJECT_NAME' and projs.append(p['id'])]" 2>/dev/null | head -1)
          
          # Fallback parsing
          if [ -z "$PROJECT_ID" ]; then
            PROJECT_ID=$(echo "$PROJECTS" | grep -oP '"id":"[^"]*' | grep -v 'token' | head -1 | cut -d'"' -f4)
          fi
          
          echo "Found project ID: $PROJECT_ID"
          
          if [ -n "$PROJECT_ID" ]; then
            # Create service with Docker image
            echo "Creating service: $SERVICE_NAME"
            curl -s -X POST "https://api.northflank.com/v1/services" \
              -H "Authorization: Bearer $NORTHFLANK_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"name\":\"$SERVICE_NAME\",\"project_id\":\"$PROJECT_ID\",\"spec\":{\"tag\":\"$IMAGE_NAME:latest\",\"deployment_strategy\":\"recreate\",\"internal_port\":8080}}" || echo "Service creation skipped"
            
            echo ""
            echo "✅ Successfully deployed to Northflank!"
            echo "   Project: $PROJECT_NAME"
            echo "   Service: $SERVICE_NAME"
            echo "   Image: $IMAGE_NAME:latest"
          else
            echo "⚠️  Could not create project via API. Please create manually at https://app.northflank.com"
            echo ""
            echo "✅ Build complete! Your Docker image:"
            echo "   $IMAGE_NAME:latest"
            echo "   Use this image URL in Northflank dashboard"
          fi
        env:
          NORTHFLANK_TOKEN: ${{ secrets.NORTHFLANK_TOKEN }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          PROJECT_NAME: ${{ env.PROJECT_NAME }}
          SERVICE_NAME: ${{ env.SERVICE_NAME }}
