name: Deploy to Northflank (Free)

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-northflank.yml'
  workflow_dispatch:

jobs:
  deploy-northflank:
    name: Deploy to Northflank (Free)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Northflank
        run: |
          set -euo pipefail
          
          if [ -z "$NORTHFLANK_TOKEN" ]; then
            echo "Northflank token not configured - skipping deployment"
            exit 0
          fi
          
          echo "Installing Northflank CLI..."
          npm install -g @northflank/northflank-cli
          
          echo "Logging in to Northflank..."
          northflank login --token "$NORTHFLANK_TOKEN"
          
          echo "Deploying fuel-pro-backend..."
          # Create project if not exists, then deploy
          northflank project create fuel-pro --org fuel-pro || true
          northflank service create fuel-pro-backend --project fuel-pro --port 8080 --min-replicas 1 || true
          northflank service deploy fuel-pro-backend --project fuel-pro --wait
          
          echo "Deployed to Northflank successfully!"
          echo "Your app should be available at: https://fuel-pro-backend.northflank.app"
        env:
          NORTHFLANK_TOKEN: ${{ secrets.NORTHFLANK_TOKEN }}
