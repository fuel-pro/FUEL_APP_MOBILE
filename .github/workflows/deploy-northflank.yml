name: Deploy to Northflank (Free)

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-northflank.yml'
  workflow_dispatch:

jobs:
  deploy-northflank:
    name: Deploy to Northflank (Free)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Northflank Registry
        uses: docker/login-action@v3
        with:
          registry: registry.northflank.com
          username: ${{ secrets.NORTHFLANK_USERNAME }}
          password: ${{ secrets.NORTHFLANK_TOKEN }}

      - name: Build and Push to Northflank
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            registry.northflank.com/fuel-pro/fuel-pro-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify deployment
        run: |
          echo "Docker image pushed to Northflank registry!"
          echo "Image: registry.northflank.com/fuel-pro/fuel-pro-backend:latest"
          echo ""
          echo "Next steps:"
          echo "1. Go to https://app.northflank.com"
          echo "2. Create a new project with Docker runtime"
          echo "3. Connect to image: registry.northflank.com/fuel-pro/fuel-pro-backend:latest"
          echo "4. Set port to 8080 and health check to /"
