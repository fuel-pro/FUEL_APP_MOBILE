name: Deploy to Northflank (Free)

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-northflank.yml'
  workflow_dispatch:

jobs:
  deploy-container:
    name: Build & Push Container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push to GHCR
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/fuel-pro/fuel-pro-backend:latest
            ghcr.io/fuel-pro/fuel-pro-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output image info
        run: |
          echo "✅ Docker image built and pushed!"
          echo "Image: ghcr.io/fuel-pro/fuel-pro-backend:latest"
          echo "SHA: ghcr.io/fuel-pro/fuel-pro-backend:${{ github.sha }}"
          echo ""
          echo "Next steps for Northflank:"
          echo "1. Go to https://app.northflank.com"
          echo "2. Create a new project with Docker runtime"
          echo "3. Connect to image: ghcr.io/fuel-pro/fuel-pro-backend:latest"
          echo "4. Set port to 8080 and health check to /"
