name: CI/CD Pipeline

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  NPM_CONFIG_LEGACY_PEER_DEPS: 'true'

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: app/package-lock.json
      - run: npm ci --legacy-peer-deps
        working-directory: ./app
      - run: npm run check || true
        working-directory: ./app

  build:
    name: Build Application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: app/package-lock.json
      - run: npm ci --legacy-peer-deps
        working-directory: ./app
      - run: npm run build
        working-directory: ./app
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: app/dist
          retention-days: 7

  build-api:
    name: Build tRPC API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: app/package-lock.json
      - run: npm ci --legacy-peer-deps
        working-directory: ./app
      - run: npm run build:api
        working-directory: ./app
      - uses: actions/upload-artifact@v4
        with:
          name: dist-api
          path: app/dist-api
          retention-days: 7

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: app/package-lock.json
      - run: npm ci --legacy-peer-deps
        working-directory: ./app
      - run: npm audit --audit-level=high || echo "Security vulnerabilities found (non-blocking)"
        working-directory: ./app

  deploy-vercel:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: app/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: app/dist
      - name: Prepare Vercel deployment
        run: |
          # Remove serverless files that shouldn't be deployed
          rm -f app/dist/boot.js
          # Copy dist to public for vercel.json outputDirectory setting
          mkdir -p app/public && cp -r app/dist/* app/public/
          rm -f app/public/boot.js
      - name: Deploy to Vercel
        run: |
          cd app && npx vercel@latest deploy --token=${{ secrets.VERCEL_TOKEN }} --prod --yes || echo "Vercel deployment skipped"
        continue-on-error: true

  deploy-api-railway:
    name: Deploy tRPC API to Railway
    runs-on: ubuntu-latest
    needs: [build-api]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: dist-api
          path: app/dist-api
      - name: Deploy to Railway
        uses: evermd/railway-deploy@v1
        with:
          token: ${{ secrets.RAILWAY_TOKEN }}
          project: ${{ secrets.RAILWAY_PROJECT_ID }}
          service: fuel-pro-trpc-api
          directory: ./app
          env: |
            NODE_ENV=production
            PORT=3000
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        continue-on-error: true
