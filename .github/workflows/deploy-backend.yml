name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'fly.toml'
      - 'render.yaml'
  workflow_dispatch:

jobs:
  deploy-fly:
    name: Deploy to Fly.io (Primary)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Launch Fly App (first time)
        run: |
          if [ -n "$FLY_API_TOKEN" ]; then
            flyctl apps create fuel-pro-backend --json || true
            flyctl volumes create fuel_app_data --region ord --size 1 || true
            flyctl deploy --remote-only --no-cache
          else
            echo "FLY_API_TOKEN not configured - skipping Fly.io deployment"
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-render:
    name: Deploy to Render (Backup)
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            curl -X POST "$RENDER_DEPLOY_HOOK"
          else
            echo "RENDER_DEPLOY_HOOK not configured - skipping Render deployment"
          fi
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
