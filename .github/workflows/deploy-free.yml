name: Deploy to Free Platforms

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'koyeb.toml'
      - 'render.yaml'
      - '.github/workflows/deploy-free.yml'
  workflow_dispatch:

jobs:
  deploy-koyeb:
    name: Deploy to Koyeb (Free)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Koyeb CLI
        run: |
          set -euo pipefail
          
          # Get latest Koyeb CLI version
          KOYEB_VERSION=$(curl -sL "https://api.github.com/repos/koyeb/koyeb-cli/releases/latest" | jq -r '.tag_name' | sed 's/v//')
          echo "Downloading Koyeb CLI v${KOYEB_VERSION}..."
          
          # Download and extract Koyeb CLI (new naming convention)
          curl -sL "https://github.com/koyeb/koyeb-cli/releases/download/v${KOYEB_VERSION}/koyeb-cli_${KOYEB_VERSION}_linux_amd64.tar.gz" -o koyeb.tar.gz
          tar xzf koyeb.tar.gz
          rm koyeb.tar.gz
          
          # Verify CLI is working
          ./koyeb version
        shell: bash

      - name: Deploy to Koyeb
        run: |
          set -euo pipefail
          
          if [ -z "$KOYEB_TOKEN" ]; then
            echo "KOYEB_TOKEN not configured - skipping Koyeb deployment"
            exit 0
          fi
          
          echo "Logging in to Koyeb..."
          ./koyeb login -t "$KOYEB_TOKEN"
          
          echo "Deploying fuel-pro-backend to Koyeb..."
          ./koyeb app create fuel-pro-backend -f koyeb.toml 2>/dev/null || \
          ./koyeb app update fuel-pro-backend -f koyeb.toml
          
          echo "Deployed to Koyeb successfully!"
        env:
          KOYEB_TOKEN: ${{ secrets.KOYEB_TOKEN }}
          CLERK_FRONTEND_API: ${{ secrets.CLERK_FRONTEND_API }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

  deploy-render:
    name: Deploy to Render (Free)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Render
        run: |
          set -euo pipefail
          
          if [ -z "$RENDER_API_KEY" ]; then
            echo "RENDER_API_KEY not configured - skipping Render deployment"
            exit 0
          fi
          
          echo "Setting up Render CLI..."
          npm install -g @render/blueprints
          
          echo "Deploying to Render..."
          render blueprint apply --token "$RENDER_API_KEY"
          
          echo "Deployed to Render successfully!"
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          CLERK_FRONTEND_API: ${{ secrets.CLERK_FRONTEND_API }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}