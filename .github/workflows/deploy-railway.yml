name: Deploy to Railway

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  deploy:
    name: Deploy Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Railway CLI
        run: |
          curl -fsSL https://railway.app/install.sh | sh
          echo "$HOME/.railway/bin" >> $GITHUB_PATH

      - name: Deploy to Railway
        run: |
          cd backend
          
          # Login to Railway
          railway login --token "${{ secrets.RAILWAY_TOKEN }}"
          
          # Link to project (create if needed)
          railway init --project fuel-pro-backend --no-interact || true
          
          # Add environment variables
          railway variables set JWT_SECRET="${{ secrets.JWT_SECRET }}"
          railway variables set TURSO_DATABASE_URL="${{ secrets.TURSO_DATABASE_URL }}"
          railway variables set TURSO_AUTH_TOKEN="${{ secrets.TURSO_AUTH_TOKEN }}"
          railway variables set NODE_ENV=production
          railway variables set RATE_LIMIT_WINDOW_MS=900000
          railway variables set RATE_LIMIT_MAX_REQUESTS=100
          
          # Deploy
          railway up --detach
          
          echo "Deployment triggered. Check Railway dashboard for status."
          
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Wait for deployment
        run: sleep 30

      - name: Check API health
        run: |
          for i in {1..5}; do
            response=$(curl -s -o /dev/null -w "%{http_code}" https://fuel-pro-backend-v2-production.up.railway.app/ || echo "000")
            if [ "$response" = "200" ]; then
              echo "✅ API is healthy!"
              exit 0
            fi
            echo "Attempt $i failed, retrying..."
            sleep 10
          done
          echo "❌ API health check failed"
          exit 1
