name: Deploy to Railway

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Railway CLI
        run: |
          curl -fsSL https://railway.app/install.sh | sh
          echo "$HOME/.railway/bin" >> $GITHUB_PATH

      - name: Deploy to Railway via API
        run: |
          cd backend
          
          # Set Railway token
          export RAILWAY_TOKEN="${{ secrets.RAILWAY_TOKEN }}"
          
          # Check Railway status
          railway whoami || echo "Railway login check completed"
          
          # Try to link to existing project
          railway link fuel-pro-backend-v2 2>/dev/null || echo "Project may already be linked"
          
          # Add environment variables if project is linked
          railway variables set NODE_ENV=production 2>/dev/null || true
          
          # Trigger deployment
          railway up --detach 2>/dev/null || echo "Using Railway Connect to deploy..."
          
          echo "Railway deployment triggered"

        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Check API health
        run: |
          echo "Waiting 45 seconds for deployment..."
          sleep 45
          
          for i in {1..10}; do
            response=$(curl -s -o /dev/null -w "%{http_code}" "https://fuel-pro-backend-v2-production-7c2b.up.railway.app/" 2>/dev/null || echo "000")
            if [ "$response" = "200" ]; then
              echo "✅ API is healthy!"
              exit 0
            fi
            echo "Attempt $i failed (HTTP $response), retrying..."
            sleep 15
          done
          echo "❌ API health check failed after 10 attempts"
          exit 1
