name: Deploy to Railway

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch:

env:
  RAILWAY_PROJECT_ID: 226c5567-8377-4520-8088-1e4c019b984a

jobs:
  deploy:
    name: Deploy Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Download Railway CLI
        run: |
          curl -fsSL https://railway.app/install.sh | sh
          echo "$HOME/.railway/bin" >> $GITHUB_PATH

      - name: Deploy to Railway
        run: |
          export RAILWAY_TOKEN="${{ secrets.RAILWAY_TOKEN }}"
          cd backend
          railway service source connect \
            --repo fuel-pro/FUEL_APP_MOBILE \
            --branch main \
            --service backend \
            --project ${{ env.RAILWAY_PROJECT_ID }} \
            --environment production || true
          
          # If connect fails, try direct upload
          railway up --detach --project ${{ env.RAILWAY_PROJECT_ID }} --environment production --service backend

  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Check API health
        run: |
          echo "Waiting 60 seconds for deployment..."
          sleep 60
          
          for i in {1..10}; do
            response=$(curl -s -o /dev/null -w "%{http_code}" "https://fuel-pro-backend-v2-production-7c2b.up.railway.app/" 2>/dev/null || echo "000")
            if [ "$response" = "200" ]; then
              echo "✅ API is healthy!"
              exit 0
            fi
            echo "Attempt $i failed (HTTP $response), retrying..."
            sleep 15
          done
          echo "❌ API health check failed after 10 attempts"
          exit 1
