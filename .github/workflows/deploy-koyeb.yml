name: Deploy to Koyeb

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'koyeb.toml'
      - '.github/workflows/deploy-koyeb.yml'
  workflow_dispatch:

jobs:
  deploy-koyeb:
    name: Deploy to Koyeb
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Koyeb
        run: |
          if [ -n "$KOYEB_TOKEN" ]; then
            curl -sL https://github.com/koyeb/cli/releases/download/v2.2.2/koyeb-cli-linux_amd64.tar.gz | tar xz
            ./koyeb login -t "$KOYEB_TOKEN"
            
            # Create app or update existing
            ./koyeb app create fuel-pro-backend -f koyeb.toml || \
            ./koyeb app update fuel-pro-backend -f koyeb.toml
            
            # Set environment variables for Clerk
            ./koyeb service update fuel-pro-backend/srv-xxxxxxxxxxxx -e CLERK_FRONTEND_API="$CLERK_FRONTEND_API" -e CLERK_SECRET_KEY="$CLERK_SECRET_KEY" -e CLERK_PUBLISHABLE_KEY="$CLERK_PUBLISHABLE_KEY" -e CLERK_WEBHOOK_SECRET="$CLERK_WEBHOOK_SECRET" -e JWT_SECRET="$JWT_SECRET" || true
            
            echo "Deployed to Koyeb successfully"
          else
            echo "KOYEB_TOKEN not configured - skipping Koyeb deployment"
          fi
        env:
          KOYEB_TOKEN: ${{ secrets.KOYEB_TOKEN }}
          CLERK_FRONTEND_API: ${{ secrets.CLERK_FRONTEND_API }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          CLERK_WEBHOOK_SECRET: ${{ secrets.CLERK_WEBHOOK_SECRET }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
