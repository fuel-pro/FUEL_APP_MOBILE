name: Deploy Backend to Render (Docker)

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'render.yaml'
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/fuel-backend

jobs:
  build-and-deploy:
    name: Build Docker Image & Deploy to Render
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Make image public
        run: |
          # Make the package public so Render can pull it
          gh api \
            --method PATCH \
            -H "Accept: application/vnd.github+json" \
            /user/packages/container/ghcr.io/${{ github.repository }}/fuel-backend \
            -f visibility=public

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/fuel-backend
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Render Deploy via Deploy Hook
        if: secrets.RENDER_DEPLOY_HOOK != ''
        run: |
          echo "Triggering Render deployment..."
          curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
          echo "Render deployment triggered!"

      - name: Show deployment info
        run: |
          echo "✅ Docker image built successfully!"
          echo "   Image: ${{ env.IMAGE_NAME }}:latest"
          echo "   SHA: ${{ github.sha }}"
          echo ""
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            echo "⚠️ RENDER_DEPLOY_HOOK not set. To enable automatic deployment:"
            echo "   1. Go to Render dashboard → your backend service"
            echo "   2. Go to Settings → Deploy Hooks"
            echo "   3. Copy the Deploy Hook URL"
            echo "   4. Add it as a secret in GitHub: Settings → Secrets → Actions"
            echo "   5. Name the secret RENDER_DEPLOY_HOOK"
          else
            echo "✅ Auto-deploy triggered via Render Deploy Hook!"
          fi
