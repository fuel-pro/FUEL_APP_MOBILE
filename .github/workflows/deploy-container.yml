name: Deploy Backend to Render (Docker)

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'render.yaml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build Docker Image & Deploy to Render
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/fuel-backend
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          no-cache: false

      - name: Get latest image digest
        id: digest
        run: |
          DIGEST=$(docker inspect ghcr.io/${{ github.repository }}/fuel-backend:latest --format='{{index .RepoDigests 0}}' | cut -d'@' -f2)
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT
          echo "Full image: ghcr.io/${{ github.repository }}/fuel-backend:latest@$DIGEST"

      - name: Trigger Render Deploy
        run: |
          echo "Waiting for image to be available..."
          sleep 10
          
          echo "Image built: ghcr.io/${{ github.repository }}/fuel-backend:latest"
          echo "Digest: ${{ steps.digest.outputs.digest }}"
          echo ""
          echo "=== NEXT STEPS ==="
          echo "To deploy manually:"
          echo "1. Go to https://dashboard.render.com/blueprints/exs-d8pv4t3sq97s738hdte0"
          echo "2. Click 'Manual Deploy' → 'Deploy latest commit'"
          echo ""
          echo "Or share the image with Render:"
          echo "ghcr.io/${{ github.repository }}/fuel-backend:latest"
