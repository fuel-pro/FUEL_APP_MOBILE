name: Deploy to Zeabur

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'zeabur.json'
      - 'zeabur.toml'
      - '.github/workflows/deploy-zeabur.yml'
  workflow_dispatch:

jobs:
  deploy-zeabur:
    name: Deploy to Zeabur
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Zeabur CLI
        run: |
          curl -sL https://github.com/zeabur/zeabur/releases/latest/download/zeabur-linux-amd64 -o zb
          chmod +x zb
          sudo mv zb /usr/local/bin/zb

      - name: Deploy to Zeabur
        run: |
          if [ -n "$ZEABUR_TOKEN" ]; then
            zb login --token "$ZEABUR_TOKEN"
            
            # Deploy the service
            zb project deploy fuel-pro-backend --wait --env CLERK_FRONTEND_API="$CLERK_FRONTEND_API" --env CLERK_SECRET_KEY="$CLERK_SECRET_KEY" --env CLERK_PUBLISHABLE_KEY="$CLERK_PUBLISHABLE_KEY" --env JWT_SECRET="$JWT_SECRET"
            
            echo "Deployed to Zeabur successfully!"
          else
            echo "ZEABUR_TOKEN not configured - skipping Zeabur deployment"
            echo "To deploy manually: https://zeabur.com/dashboard"
          fi
        env:
          ZEABUR_TOKEN: ${{ secrets.ZEABUR_TOKEN }}
          CLERK_FRONTEND_API: ${{ secrets.CLERK_FRONTEND_API }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
