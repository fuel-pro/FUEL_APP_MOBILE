name: Deploy to Zeabur

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'zeabur.json'
      - 'zeabur.toml'
      - '.github/workflows/deploy-zeabur.yml'
  workflow_dispatch:

jobs:
  deploy-zeabur:
    name: Deploy to Zeabur
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Zeabur CLI
        run: |
          set -euo pipefail

          # Resolve the correct download URL from the GitHub Releases API
          download_url=$(curl -s "https://api.github.com/repos/zeabur/zeabur/releases/latest" \
            | grep "browser_download_url" \
            | grep "linux" \
            | grep -E "amd64|x86_64" \
            | head -n1 \
            | cut -d '"' -f4)

          if [ -z "$download_url" ]; then
            echo "ERROR: Could not find a linux-amd64 zb asset in the latest release."
            echo "API output:"
            curl -s "https://api.github.com/repos/zeabur/zeabur/releases/latest" || true
            exit 1
          fi

          echo "Downloading zb from: $download_url"
          curl -fL "$download_url" -o zb

          # Quick sanity checks: make sure it's a binary (ELF) before installing
          if ! command -v file >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y file
          fi

          if ! file zb | grep -qE 'ELF|executable'; then
            echo "ERROR: downloaded zb is not an ELF binary. Showing first 100 lines of the file:"
            head -n 100 zb || true
            rm -f zb
            exit 1
          fi

          chmod +x zb
          sudo mv zb /usr/local/bin/zb
        shell: bash

      - name: Deploy to Zeabur
        run: |
          if [ -n "$ZEABUR_TOKEN" ]; then
            zb login --token "$ZEABUR_TOKEN"
            
            # Deploy the service
            zb project deploy fuel-pro-backend --wait --env CLERK_FRONTEND_API="$CLERK_FRONTEND_API" --env CLERK_SECRET_KEY="$CLERK_SECRET_KEY" --env CLERK_PUBLISHABLE_KEY="$CLERK_PUBLISHABLE_KEY" --env JWT_SECRET="$JWT_SECRET"
            
            echo "Deployed to Zeabur successfully!"
          else
            echo "ZEABUR_TOKEN not configured - skipping Zeabur deployment"
            echo "To deploy manually: https://zeabur.com/dashboard"
          fi
        env:
          ZEABUR_TOKEN: ${{ secrets.ZEABUR_TOKEN }}
          CLERK_FRONTEND_API: ${{ secrets.CLERK_FRONTEND_API }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
