name: Deploy to Zeabur

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'zeabur.json'
      - 'zeabur.toml'
      - '.github/workflows/deploy-zeabur.yml'
  workflow_dispatch:

jobs:
  deploy-zeabur:
    name: Deploy to Zeabur
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Zeabur CLI
        run: |
          set -euo pipefail

          # Try to download from zeabur/cli repo first, fall back to zeabur/zeabur if needed
          for repo in "zeabur/cli" "zeabur/zeabur"; do
            echo "Attempting to download from $repo..."
            
            # Get the latest release
            release_url="https://api.github.com/repos/${repo}/releases/latest"
            
            # Try to find linux-amd64 asset
            download_url=$(curl -s "$release_url" \
              | jq -r '.assets[] | select(.name | contains("linux") and contains("amd64")) | .browser_download_url' \
              | head -n1)
            
            if [ -n "$download_url" ] && [ "$download_url" != "null" ]; then
              echo "Found download URL: $download_url"
              break
            fi
          done

          if [ -z "$download_url" ] || [ "$download_url" = "null" ]; then
            echo "ERROR: Could not find a linux-amd64 zb asset in zeabur releases."
            echo "Available assets from zeabur/cli:"
            curl -s "https://api.github.com/repos/zeabur/cli/releases/latest" | jq '.assets[] | .name' 2>/dev/null || true
            echo "Available assets from zeabur/zeabur:"
            curl -s "https://api.github.com/repos/zeabur/zeabur/releases/latest" | jq '.assets[] | .name' 2>/dev/null || true
            exit 1
          fi

          echo "Downloading zb from: $download_url"
          if ! curl -fL "$download_url" -o zb; then
            echo "ERROR: Failed to download zb binary"
            exit 1
          fi

          # Quick sanity checks: make sure it's a binary (ELF) before installing
          if ! command -v file >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y file
          fi

          if ! file zb | grep -qE 'ELF|executable'; then
            echo "ERROR: downloaded zb is not an ELF binary."
            echo "File type:"
            file zb || true
            echo "First 100 bytes:"
            head -c 100 zb || true
            rm -f zb
            exit 1
          fi

          chmod +x zb
          sudo mv zb /usr/local/bin/zb
          echo "Zeabur CLI installed successfully"
          zb version || echo "Note: zb version check not available"
        shell: bash

      - name: Deploy to Zeabur
        run: |
          set -euo pipefail
          
          if [ -z "$ZEABUR_TOKEN" ]; then
            echo "ERROR: ZEABUR_TOKEN not configured. Please add it to your repository secrets."
            echo "To deploy manually: https://zeabur.com/dashboard"
            exit 1
          fi
          
          echo "Logging in to Zeabur..."
          zb auth login --token "$ZEABUR_TOKEN" -i=false
          
          echo "Finding fuel-pro-backend project..."
          # List projects and find the one named fuel-pro-backend
          PROJECTS_JSON=$(zb project ls -i=false --json 2>/dev/null || echo "[]")
          echo "Raw projects JSON: $PROJECTS_JSON"
          PROJECT_ID=$(echo "$PROJECTS_JSON" | jq -r '.[] | select(.name == "fuel-pro-backend") | .id' 2>/dev/null | head -1)
          
          # Debug: show all available projects
          echo "Available projects:"
          echo "$PROJECTS_JSON" | jq '.[] | {name: .name, id: .id}' 2>/dev/null || echo "No projects found"
          
          if [ -z "$PROJECT_ID" ] || [ "$PROJECT_ID" = "null" ]; then
            echo "ERROR: Could not find project 'fuel-pro-backend'. Please ensure the project exists in Zeabur dashboard."
            exit 1
          fi
          
          echo "Found project ID: $PROJECT_ID"
          
          # Set project context
          zb context set project --id "$PROJECT_ID" -i=false
          
          echo "Deploying backend service..."
          # Deploy using project ID and service name
          zb deploy --name "backend" --project-id "$PROJECT_ID" -i=false
          
          echo "Updating environment variables..."
          # Get the service ID after deployment
          SERVICE_ID=$(zb service ls -i=false --json 2>/dev/null | jq -r '.[] | select(.name == "backend") | .id' | head -1)
          
          if [ -n "$SERVICE_ID" ] && [ "$SERVICE_ID" != "null" ]; then
            echo "Setting environment variables for service: $SERVICE_ID"
            zb variable create --service-id "$SERVICE_ID" --key CLERK_FRONTEND_API --value "$CLERK_FRONTEND_API" -i=false 2>/dev/null || \
            zb variable update --service-id "$SERVICE_ID" --key CLERK_FRONTEND_API --value "$CLERK_FRONTEND_API" -i=false 2>/dev/null || true
            zb variable create --service-id "$SERVICE_ID" --key CLERK_SECRET_KEY --value "$CLERK_SECRET_KEY" -i=false 2>/dev/null || \
            zb variable update --service-id "$SERVICE_ID" --key CLERK_SECRET_KEY --value "$CLERK_SECRET_KEY" -i=false 2>/dev/null || true
            zb variable create --service-id "$SERVICE_ID" --key CLERK_PUBLISHABLE_KEY --value "$CLERK_PUBLISHABLE_KEY" -i=false 2>/dev/null || \
            zb variable update --service-id "$SERVICE_ID" --key CLERK_PUBLISHABLE_KEY --value "$CLERK_PUBLISHABLE_KEY" -i=false 2>/dev/null || true
            zb variable create --service-id "$SERVICE_ID" --key JWT_SECRET --value "$JWT_SECRET" -i=false 2>/dev/null || \
            zb variable update --service-id "$SERVICE_ID" --key JWT_SECRET --value "$JWT_SECRET" -i=false 2>/dev/null || true
            echo "Environment variables updated"
          else
            echo "Warning: Could not find service 'backend'. Skipping environment variable update."
          fi
          
          echo "✅ Deployed to Zeabur successfully!"
        env:
          ZEABUR_TOKEN: ${{ secrets.ZEABUR_TOKEN }}
          CLERK_FRONTEND_API: ${{ secrets.CLERK_FRONTEND_API }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
