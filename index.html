    <title>FuelPro - Fuel Management System</title>
    <!-- Prevent FOUC (Flash of Unstyled Content) - Apply theme BEFORE React loads -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("fuelpro_theme");
          var prefersDark =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
          var isDark =
            theme === "dark" ||
            (theme === "system" && prefersDark) ||
            (!theme && prefersDark);
          if (isDark) {
            document.documentElement.classList.add("dark");
            document.documentElement.setAttribute("data-theme", "dark");
            document.body.style.colorScheme = "dark";
          } else {
            document.documentElement.classList.add("light");
            document.documentElement.setAttribute("data-theme", "light");
            document.body.style.colorScheme = "light";
          }
        } catch (e) {}
      })();
    </script>
    <!-- Clerk publishable key injection for runtime -->
    <style>
      /* Critical CSS - Prevent flash of white background in dark mode */
      html.dark {
        background-color: #1a1a1a;
      }
      html.light {
        background-color: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        html:not(.light):not(.dark) {
          background-color: #1a1a1a;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/react-app/main.tsx"></script>
    <script>
      // Service Worker registration with AGGRESSIVE automatic update handling.
      //
      // The custom public/sw.js is NETWORK-FIRST for navigations, so a fresh
      // index.html is fetched on every page load — deploys are visible
      // immediately. This script also:
      //   - registers on DOMContentLoaded (not waiting for full load) for speed
      //   - polls for SW updates every 2 min while the tab is open
      //   - auto-reloads on controllerchange
      //   - self-heals: if a script chunk 404s, unregisters the SW + reloads
      if ("serviceWorker" in navigator) {
        var refreshing = false;
        navigator.serviceWorker.addEventListener(
          "controllerchange",
          function () {
            if (refreshing) return;
            refreshing = true;
            window.location.reload();
          },
        );

        function checkForUpdate(reg) {
          reg.update().catch(function () {});
        }

        function handleUpdateFound(reg) {
          var newWorker = reg.installing;
          if (!newWorker) return;
          newWorker.addEventListener("statechange", function () {
            if (
              newWorker.state === "installed" &&
              navigator.serviceWorker.controller
            ) {
              newWorker.postMessage({ type: "SKIP_WAITING" });
            }
          });
        }

        function registerSW() {
          navigator.serviceWorker
            .register("/sw.js", { updateViaCache: "none" })
            .then(function (reg) {
              reg.addEventListener("updatefound", function () {
                handleUpdateFound(reg);
              });
              checkForUpdate(reg);
              // Poll for updates every 2 minutes while the tab is open.
              setInterval(function () {
                checkForUpdate(reg);
              }, 120000);
            })
            .catch(function () {});
        }

        // Register as early as possible.
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", registerSW);
        } else {
          registerSW();
        }

        // Also check on pageshow (covers bfcache + tab reactivation).
        window.addEventListener("pageshow", function (event) {
          if (event.persisted) {
            navigator.serviceWorker.getRegistration().then(function (reg) {
              if (reg) checkForUpdate(reg);
            });
          }
        });

        // Stale-SW self-heal: if a script chunk fails to load, unregister the
        // SW and reload so the browser fetches fresh assets.
        window.addEventListener(
          "error",
          function (event) {
            var target = event.target;
            if (
              target &&
              target.tagName === "SCRIPT" &&
              target.src &&
              target.src.indexOf("/assets/") !== -1
            ) {
              console.warn(
                "[SW-heal] Script failed to load, unregistering SW + reloading:",
                target.src,
              );
              navigator.serviceWorker
                .getRegistrations()
                .then(function (regs) {
                  return Promise.all(
                    regs.map(function (r) {
                      return r.unregister();
                    }),
                  );
                })
                .then(function () {
                  window.location.reload();
                })
                .catch(function () {
                  window.location.reload();
                });
            }
          },
          true,
        );
      }
    </script>
  </body>
