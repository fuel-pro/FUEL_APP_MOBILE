# Render Blueprint for FuelPro Backend
# This file enables auto-deploys from the main branch

services:
  - type: web
    name: fuel-pro-backend
    env: docker
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: fuelpro-sqlite
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
