# Render Blueprint for FuelPro Backend
# Connect this repo to Render at https://dashboard.render.com/blueprints
# This file enables auto-deploys from the main branch

services:
  - type: web
    name: fuel-pro-backend
    env: docker
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: JWT_SECRET
        generateValue: true
