# Render Blueprint for FuelPro Backend
# Connect this repo to Render at https://dashboard.render.com/blueprints
# This file enables auto-deploys from the main branch

services:
  - type: web
    name: fuel-pro-backend-v2
    env: docker
    region: oregon
    image:
      # Use pre-built image from GitHub Container Registry
      url: ghcr.io/fuel-pro/fuel_app_mobile/fuel-backend:latest
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: JWT_SECRET
        generateValue: true
