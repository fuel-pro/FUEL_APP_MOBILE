# render.yaml - Render Blueprint
# This file defines the infrastructure for the FUEL App Backend

services:
  - type: web
    name: fuel-app-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    plan: free
    region: oregon
    branch: main
    rootDir: backend
    healthCheckPath: /health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
