# FuelPro Backend - Koyeb Deployment
# Free forever tier with persistent storage

name = "fuel-pro-backend"
runtimes = ["docker"]
region = "fra"

[build]
  dockerfile = "backend/Dockerfile"

[ports]
  port = 8080
  protocol = "http"

[health_checks]
  path = "/"

[scale]
  min_instances = 1
  max_instances = 1

[resources]
  memory = "256Mi"
  cpu = "0.25"

[volumes]
  [volumes.data]
    mount = "/app/data"
    size = 512  # MB - persistent storage for SQLite

[env]
  NODE_ENV = "production"
  PORT = "8080"
  # JWT Secret (generate a secure random string)
  # JWT_SECRET = "your-secure-jwt-secret-here"
  # Clerk Configuration (set these in Koyeb dashboard for security)
  # CLERK_SECRET_KEY = "your-clerk-secret-key"
  # CLERK_FRONTEND_API = "https://immense-mullet-70.clerk.accounts.dev"
  # CLERK_PUBLISHABLE_KEY = "your-clerk-publishable-key"
  # CLERK_WEBHOOK_SECRET = "your-clerk-webhook-secret"
