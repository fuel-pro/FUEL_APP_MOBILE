# FuelPro Full Stack Docker Compose
# Run all services: Frontend, Backend, AI Assistant, Database

version: '3.8'

services:
  # Frontend (React + Vite)
  frontend:
    build:
      context: ./app
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8080
      - VITE_AI_URL=http://localhost:8000
    depends_on:
      - backend
      - ai-service
    networks:
      - fuelpro-network

  # Backend API (Express + SQLite)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - JWT_SECRET=${JWT_SECRET:-fuelpro-secret-key-change-in-production}
      - DATABASE_PATH=/app/data/fuelpro.db
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - CORS_ORIGIN=http://localhost:3000
    volumes:
      - ./backend/data:/app/data
      - ./backend/logs:/app/logs
    depends_on:
      - db
    networks:
      - fuelpro-network

  # AI Financial Assistant (FastAPI + Groq)
  ai-service:
    build:
      context: ./ai-services/rag-api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - PORT=8000
    volumes:
      - ./ai-services/rag-api/data:/app/data
    networks:
      - fuelpro-network

  # SQLite Database
  db:
    image: alpine:latest
    command: /bin/true
    volumes:
      - db-data:/data
    networks:
      - fuelpro-network

  # Nginx Reverse Proxy (Optional - for production)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
      - ai-service
    networks:
      - fuelpro-network

networks:
  fuelpro-network:
    driver: bridge

volumes:
  db-data:
