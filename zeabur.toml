# Zeabur deployment configuration for FuelPro Backend
# Zeabur free tier: https://zeabur.com - No credit card required!

[project]
name = "fuel-pro-backend"

[services.backend]
path = "./backend"
dockerfile = "./backend/Dockerfile"
healthcheck = "/"
port = 8080

[[services.backend.env]]
key = "NODE_ENV"
value = "production"

[[services.backend.env]]
key = "PORT"
value = "8080"

# Note: Set sensitive env vars in Zeabur dashboard for security
# CLERK_SECRET_KEY, CLERK_FRONTEND_API, CLERK_PUBLISHABLE_KEY, JWT_SECRET

[[services.backend.disks]]
name = "fuel-data"
mount = "/app/data"
size = 512  # MB - persistent storage
